name: Deploy HROS Web3D to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Test HROS v1.2 API, ontology and agent runtime
        working-directory: backend
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Runtime diagnostics
        run: node --version && npm --version && python --version

      - name: Verify canonical HROS v1.2 source tree
        run: |
          test -f src/main.js
          test -f src/style.css
          test -f src/repository.js
          test -f src/domain-v1.js
          test -f src/alignment-v1.js
          test -f src/alignment-v1.css
          test -f src/diary-v1.js
          test -f src/diary-v1.css
          test -f src/diary-messenger-bridge.js
          test -f src/messenger-v1.js
          test -f src/messenger-v1.css
          test -f src/messenger-command-bridge.js
          test -f src/command-ui-v1.js
          test -f src/command-ui-v1.css
          test -f src/scene.js
          test -f src/v03-editor.js
          test -f src/v04-moments.js
          test -f src/v04/core.js
          test -f backend/app/agent_runtime.py
          test -f tests/browser-smoke.spec.js
          test -f playwright.config.js
          test -f skills/registry.json
          test -f skills/schemas/hros-skill-envelope.schema.json
          test -f skills/schemas/hros-domain-record.schema.json
          test -f skills/ai-diary-session/SKILL.md
          test -f skills/hros-game-interface-director/SKILL.md
          test -f skills/hros-messenger-agent-runtime/SKILL.md
          test -f skills/moment-engine/SKILL.md
          test -f skills/moment-engine/moment.schema.json
          test -f skills/person-profile/SKILL.md
          test -f skills/relationship-state/SKILL.md
          test -f skills/action-impact/SKILL.md
          test -f skills/evidence-intake/SKILL.md
          test -f skills/perspective-capture/SKILL.md
          test -f skills/interview-engine/SKILL.md
          test -f skills/memory-projection/SKILL.md
          test -f skills/book-builder/SKILL.md
          test -f skills/consent-visibility/SKILL.md
          test -f skills/n8n-workflow-adapter/SKILL.md
          test -f skills/diagnostic-package/SKILL.md
          test -f docs/HROS_MESSENGER_AND_AGENT_RUNTIME_v1.md
          test -f docs/HROS_UI_UX_GAME_DESIGN_v1.md
          test -f docs/HROS_IDEOLOGY_AI_DIARY_v1.md
          test -f docs/HROS_BLUEPRINT_v1.md
          test -f docs/HROS_PRODUCT_PRINCIPLES_v1.md
          test -f docs/HROS_DOMAIN_ONTOLOGY_v1.md
          test -f docs/HROS_DATA_LIFECYCLE_v1.md
          test -f docs/HROS_PRIVACY_AND_CONSENT_v1.md
          test -f docs/HROS_SKILL_ARCHITECTURE_v1.md
          test -f docs/HROS_VISUAL_SEMANTICS_v1.md
          test -f docs/HROS_MIGRATION_v0.4_to_v1.md
          test -f docs/HROS_ACCEPTANCE_CRITERIA_v1.md
          test -f docs/HROS_ALIGNMENT_REPORT_v1.md
          node -e "const p=require('./package.json'); if(p.version!=='1.2.0') process.exit(1)"
          grep -q "schemaVersion: '1.0.0'" src/seed.js
          grep -q "Живой диалог" docs/HROS_BLUEPRINT_v1.md
          grep -q "полноэкран" docs/HROS_MESSENGER_AND_AGENT_RUNTIME_v1.md
          grep -q '"hros-messenger-agent-runtime"' skills/registry.json
          grep -q "OPENAI_API_KEY" .env.example
          grep -q "OPENROUTER_API_KEY" .env.example
          python -m json.tool skills/registry.json > /dev/null
          python -m json.tool skills/schemas/hros-skill-envelope.schema.json > /dev/null
          python -m json.tool skills/schemas/hros-domain-record.schema.json > /dev/null
          node --check src/diary-v1.js
          node --check src/diary-messenger-bridge.js
          node --check src/messenger-v1.js
          node --check src/messenger-command-bridge.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/config.js && grep -q '/HROS-Web3D/assets/' dist/index.html && find dist -maxdepth 2 -type f -print

      - name: Install Playwright smoke-test runtime
        run: npm install --no-save --no-package-lock @playwright/test@1.62.0 && npx playwright install --with-deps chromium webkit

      - name: Browser acceptance test — Chromium and WebKit
        run: |
          npm run preview > /tmp/hros-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true; cat /tmp/hros-preview.log' EXIT
          npx playwright test tests/browser-smoke.spec.js --workers=1 --reporter=line

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hros-v1.2-messenger-browser-diagnostics-${{ github.run_id }}
          path: |
            test-results
            playwright-report
            /tmp/hros-preview.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    steps:
      - name: Publish verifiable pipeline status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          event=os.environ['EVENT_NAME'];test=os.environ['TEST_RESULT'];build=os.environ['BUILD_RESULT'];deploy=os.environ['DEPLOY_RESULT']
          successful=test=='success' and build=='success' and (event=='pull_request' or deploy=='success')
          context='hros/ci' if event=='pull_request' else 'hros/pages-pipeline'
          payload=json.dumps({'state':'success' if successful else 'failure','context':context,'description':f'v1.2 agents={test}; messenger+browser={build}; deploy={deploy}'[:140],'target_url':os.environ['RUN_URL']}).encode()
          request=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['COMMIT_SHA']}",data=payload,method='POST',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','User-Agent':'HROS-CI','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:print(response.status,response.read().decode()[:300])
          if not successful:raise SystemExit(1)
          PY
