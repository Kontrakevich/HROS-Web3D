name: Deploy HROS Web3D to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore missing source files
        shell: bash
        run: |
          if [ ! -f src/main.js ]; then
            archive="HROS-Web3D_GitHub_Import_v0.1.zip"
            test -f "$archive"
            rm -rf .hros-import
            mkdir .hros-import
            unzip -q "$archive" -d .hros-import
            project_dir="$(dirname "$(find .hros-import -type f -path '*/src/main.js' -print -quit)")/.."
            test -f "$project_dir/src/main.js"
            cp -R "$project_dir/src" ./src
            if [ -f "$project_dir/vite.config.js" ]; then cp "$project_dir/vite.config.js" ./vite.config.js; fi
          fi
          test -f src/main.js
          test -f src/style.css

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Runtime diagnostics
        run: node --version && npm --version && find src -maxdepth 2 -type f -print

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && find dist -maxdepth 2 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
