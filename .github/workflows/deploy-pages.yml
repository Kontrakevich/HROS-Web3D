name: Deploy HROS Web3D to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Test Data Core API
        working-directory: backend
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Runtime diagnostics
        run: node --version && npm --version && python --version

      - name: Verify source tree
        run: test -f src/main.js && test -f src/style.css && test -f src/repository.js && test -f src/scene.js

      - name: Generate Vite 8 lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "HROS CI"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m "Regenerate package-lock for Vite 8.1.5"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: vite-8-lock
          path: package-lock.json
          if-no-files-found: error

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html && test -f dist/config.js && find dist -maxdepth 2 -type f -print

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    steps:
      - name: Publish verifiable pipeline status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          event = os.environ["EVENT_NAME"]
          test = os.environ["TEST_RESULT"]
          build = os.environ["BUILD_RESULT"]
          deploy = os.environ["DEPLOY_RESULT"]
          successful = test == "success" and build == "success" and (event == "pull_request" or deploy == "success")
          context = "hros/ci" if event == "pull_request" else "hros/pages-pipeline"
          description = f"test={test}; build={build}; deploy={deploy}"
          payload = json.dumps({
              "state": "success" if successful else "failure",
              "context": context,
              "description": description[:140],
              "target_url": os.environ["RUN_URL"],
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/statuses/{os.environ['COMMIT_SHA']}",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "HROS-CI",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status, response.read().decode("utf-8")[:300])
          if not successful:
              raise SystemExit(1)
          PY
