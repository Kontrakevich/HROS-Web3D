services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: hros
      POSTGRES_USER: hros
      POSTGRES_PASSWORD: hros_local_password
    volumes:
      - hros_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hros -d hros"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://hros:hros_local_password@db:5432/hros
      CORS_ORIGINS: http://localhost:8088,http://127.0.0.1:8088
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  hros_postgres_data:
